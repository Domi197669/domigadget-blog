<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00236f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0060ac;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#003c70;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Icon: stylized gadget/shield with D -->
  <g transform="translate(60, 30)">
    <!-- Shield base -->
    <rect x="10" y="10" width="220" height="220" rx="40" fill="url(#grad1)"/>
    <!-- Circuit line top-right -->
    <path d="M180 40 L200 40 L200 60" stroke="rgba(255,255,255,0.3)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="68" r="4" fill="rgba(255,255,255,0.3)"/>
    <!-- Circuit line bottom-left -->
    <path d="M40 200 L20 200 L20 180" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="172" r="4" fill="rgba(255,255,255,0.2)"/>
    <!-- D letter -->
    <text x="120" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="160" fill="white" text-anchor="middle">D</text>
    <!-- Accent dot -->
    <circle cx="175" cy="105" r="12" fill="#64a8fe"/>
  </g>
  <!-- Domigadget text -->
  <text x="340" y="160" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="72" fill="#00236f" letter-spacing="-1">Domigadget</text>
  <!-- Tagline -->
  <text x="340" y="200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="22" fill="#0060ac" letter-spacing="4">TECNOLOGÍA PARA TODOS</text>
  <!-- Decorative line -->
  <line x1="340" y1="218" x2="540" y2="218" stroke="#64a8fe" stroke-width="3" stroke-linecap="round"/>
</svg>
